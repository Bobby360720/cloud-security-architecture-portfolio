# Azure DevOps CI Pipeline
# Cloud Security Architecture Portfolio
#
# Bootstrap CI:
#   - Checkout repository
#   - Install Terraform
#   - Check formatting
#   - Authenticate to Azure using Workload Identity Federation
#   - Initialize Terraform using Azure remote state
#   - Validate Terraform
#   - Generate Terraform plan
#
# No Azure deployment occurs in this pipeline.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.16.3'
  terraformWorkingDirectory: '00-bootstrap/terraform'

steps:

- checkout: self
  displayName: 'Checkout Repository'

- bash: |
    set -e

    wget -q \
      https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip

    unzip -q terraform_$(terraformVersion)_linux_amd64.zip

    sudo mv terraform /usr/local/bin/

    terraform version
  displayName: 'Install Terraform'

- bash: |
    terraform fmt -check -recursive
  workingDirectory: $(terraformWorkingDirectory)
  displayName: 'Terraform Format Check'

- task: AzureCLI@2
  displayName: 'Verify Azure Authentication'
  inputs:
    azureSubscription: 'sc-azure-sub-management-01-wif'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Authenticated Azure context:"

      az account show \
        --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
        --output table

- task: AzureCLI@2
  displayName: 'Terraform Init and Validate'
  inputs:
    azureSubscription: 'sc-azure-sub-management-01-wif'
    addSpnToEnvironment: true
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(terraformWorkingDirectory)'
    inlineScript: |
      set -e

      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
      export ARM_USE_OIDC=true
      export ARM_OIDC_TOKEN="$idToken"

      echo "Initializing Terraform remote backend..."
      terraform init

      echo "Validating Terraform configuration..."
      terraform validate

- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'sc-azure-sub-management-01-wif'
    addSpnToEnvironment: true
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(terraformWorkingDirectory)'
    inlineScript: |
      set -e

      export ARM_CLIENT_ID="$servicePrincipalId"
      export ARM_TENANT_ID="$tenantId"
      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
      export ARM_USE_OIDC=true
      export ARM_OIDC_TOKEN="$idToken"

      echo "Generating Terraform plan..."
      terraform plan -out=tfplan